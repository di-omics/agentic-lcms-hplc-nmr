name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run pytest
      - name: ASCII only
        run: |
          bad=$(git ls-files | xargs grep -IlP '[^\x00-\x7F]' || true)
          if [ -n "$bad" ]; then echo "non-ASCII bytes in: $bad"; exit 1; fi
